>builtin-shapes</text></g><!--entity QUERYPLUGINS--><g id="elem_QUERYPLUGINS"><rect fill="#F1F1F1" height="55.2188" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="116" x="186" y="406.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96" x="196" y="431.1426">command-stats</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="82" x="196" y="448.752">command-dir</text></g><!--entity LABELPLUGINS--><g id="elem_LABELPLUGINS"><rect fill="#F1F1F1" height="55.2188" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="86" x="53" y="523.1094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="66" x="63" y="547.6426">shape-box</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="54" x="63" y="565.252">tree-star</text></g><!--entity BADGE--><g id="elem_BADGE"><rect fill="#F1F1F1" height="37.6094" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="257" x="1342.5" y="260.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="237" x="1352.5" y="285.1426">FileDecorationProvider / badge policy</text></g><!--entity OUTLINE--><g id="elem_OUTLINE"><rect fill="#F1F1F1" height="37.6094" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="280" x="1037" y="260.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="260" x="1047" y="285.1426">DocumentSymbolProvider / syntax parser</text></g><!--entity CORE--><g id="elem_CORE"><rect fill="#F1F1F1" height="108.0469" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="387" x="782.5" y="496.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="242" x="792.5" y="521.1426">@svgframe/core (public package root)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="241" x="792.5" y="538.752">domain / Composite / local ChangeSet</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="367" x="792.5" y="556.3613">session / history / transactions / immutable scene + events</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="221" x="792.5" y="573.9707">four extension contracts / registries</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="248" x="792.5" y="591.5801">SVG I/O / Directory / Construction ports</text></g><!--entity API--><g id="elem_API"><rect fill="#F1F1F1" height="37.6094" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="162" x="1219" y="415.1094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="142" x="1229" y="439.6426">VSCode Extension API</text></g><!--entity SAXES--><g id="elem_SAXES"><rect fill="#F1F1F1" height="37.6094" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="142" x="1033" y="415.1094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122" x="1043" y="439.6426">saxes (XML parser)</text></g><g id="elem_GMN35"><path d="M359,513.1094 L359,588.5156 L757,588.5156 L757,523.1094 L747,513.1094 L359,513.1094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M747,513.1094 L747,523.1094 L757,523.1094 L747,513.1094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284" x="365" y="531.6045">Every plugin imports only @svgframe/core public.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="377" x="365" y="547.9561">No plugin-to-plugin imports; box and star do not know each other.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221" x="365" y="564.3076">Default order: stats, dir, box, tree-star.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311" x="365" y="580.6592">No concrete plugin names in core, loader or formatter.</text></g><g id="elem_GMN38"><path d="M1443,412.6094 L1443,455.3125 L1807,455.3125 L1807,422.6094 L1797,412.6094 L1443,412.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1797,412.6094 L1797,422.6094 L1807,422.6094 L1797,412.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="343" x="1449" y="431.1045">No CLI/core imports; syntax-only, preserves source ranges.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="322" x="1449" y="447.4561">VSIX bundles saxes; vscode is the only external import.</text></g><!--link ENTRY to COMPOSE--><g id="link_ENTRY_COMPOSE"><path d="M727,119.7894 C727,130.5194 727,137.8494 727,148.5594 " fill="none" id="ENTRY-to-COMPOSE" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="727,154.5594,731,145.5594,727,149.5594,723,145.5594,727,154.5594" style="stroke:#181818;stroke-width:1.0;"/></g><!--link ENTRY to CLI--><g id="link_ENTRY_CLI"><path d="M800.5,119.7894 C800.5,130.5194 800.5,137.8494 800.5,148.5594 " fill="none" id="ENTRY-to-CLI" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="800.5,154.5594,804.5,145.5594,800.5,149.5594,796.5,145.5594,800.5,154.5594" style="stroke:#181818;stroke-width:1.0;"/></g><!--link COMPOSE to INSTALL--><g id="link_COMPOSE_INSTALL"><path d="M688.25,192.7694 C688.25,240.9394 688.25,360.7194 688.25,408.9294 " fill="none" id="COMPOSE-to-INSTALL" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="688.25,414.9294,692.25,405.9294,688.25,409.92